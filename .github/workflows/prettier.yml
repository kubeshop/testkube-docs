name: Prettier

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  prettier:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine changed files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.mdx' '*.yml' '*.yaml' '*.css' \
            ':(exclude)package-lock.json' \
            ':(exclude)docs/cli/**' \
            ':(exclude)docs/crd/**' \
            ':(exclude)docs/inventory/**' \
            ':(exclude)docs/openapi/**' \
            ':(exclude)docs/articles/inventory/generated/**' \
            ':(exclude)static/openapi/**')"

          if [ -z "$files" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_files=true"
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check changed files with Prettier
        if: steps.changed-files.outputs.has_files == 'true'
        run: |
          printf '%s\n' "${{ steps.changed-files.outputs.files }}" | xargs npx prettier --check
